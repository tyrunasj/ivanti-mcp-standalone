name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: tyrunas/ivanti-mcp

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catch a half-finished bump here rather than at release time: package.json,
      # Chart.yaml version and Chart.yaml appVersion must already agree on main.
      - run: node scripts/check-version.mjs --check

      # All four, and all of them even when an earlier one fails: one round trip
      # beats four. `typecheck` is not redundant with `build` — the build config
      # excludes tests and fixtures, so this is the only thing that types them.
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}

      # The tarball is a release artefact, but building it here means a change that
      # breaks relocation is caught on the PR rather than at tag time.
      - run: ./scripts/release-tarball.sh "${RUNNER_TEMP}/release"
        if: ${{ !cancelled() }}

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Whether we can publish at all. A secret is not readable in an `if:`,
      # so it is turned into an output here and the push steps key off that.
      # Without this the login step hard-fails and reds a run whose only real
      # problem is that nobody has configured a registry yet.
      - id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set - building without publishing."
          fi

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # A pull request builds but never pushes: a fork must not be able to
      # publish to the namespace. Nor does a push with no credentials configured
      # — it still builds both architectures, which is the part worth checking.
      # The build context is the REPOSITORY ROOT.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && steps.creds.outputs.available == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
