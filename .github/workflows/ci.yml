name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catch a half-finished bump here rather than at release time: package.json,
      # Chart.yaml version and Chart.yaml appVersion must already agree on main.
      - run: node scripts/check-version.mjs --check

      # All four, and all of them even when an earlier one fails: one round trip
      # beats four. `typecheck` is not redundant with `build` — the build config
      # excludes tests and fixtures, so this is the only thing that types them.
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}

      # Examples get copied before they get read, so one that exits 78 is worse
      # than none. Drives the real loadConfig; needs dist/, hence after build.
      - run: pnpm check:examples
        if: ${{ !cancelled() }}

      # The tarball is a release artefact, but building it here means a change that
      # breaks relocation is caught on the PR rather than at tag time.
      - run: ./scripts/release-tarball.sh "${RUNNER_TEMP}/release"
        if: ${{ !cancelled() }}

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # CI BUILDS BUT NEVER PUBLISHES. Only a tag publishes, in release.yml.
      #
      # What is worth checking on every commit is that the image still builds for
      # both architectures — arm64 goes through QEMU here and is the one that
      # breaks. What is NOT worth doing is filling a public registry with a tag per
      # commit: `main` and `sha-<short>` are indistinguishable from a release to
      # anyone reading the tag list, and they cost a push every merge.
      #
      # Because nothing is pushed, this job needs no registry credentials at all —
      # which also means a fork's pull request builds exactly what main does.
      # The build context is the REPOSITORY ROOT.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ivanti-mcp:ci
          cache-from: type=gha
          # Warms the cache the release build reads, so a tag does not rebuild
          # both architectures from scratch.
          cache-to: type=gha,mode=max
