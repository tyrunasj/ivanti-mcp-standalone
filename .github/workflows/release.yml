name: Release

# MANUAL, AND THE VERSION COMES FROM package.json — NOT FROM A TAG YOU TYPE.
#
# Actions -> Release -> Run workflow, pick the branch, press the button. The
# workflow reads `package.json`, refuses if `Chart.yaml` disagrees or if that
# version has already been released, builds everything, and creates the tag
# and the GitHub Release itself at the end.
#
# So there is exactly one place a human writes a version — `package.json`,
# with `pnpm version:sync` mirroring it into the chart — and the tag is a
# consequence rather than a second copy to keep in step.
#
# ⚠️ Pushing a tag by hand now triggers NOTHING. That is the point: a tag is
# an output of this workflow, not an input to it.
#
# The tag is created LAST, by the release step. A run that dies halfway leaves
# a published image and no tag, which retries cleanly by pressing the button
# again; tagging first would leave an orphan tag that has to be deleted before
# a retry is possible.
#
# RELEASE means: image on Docker Hub, chart on ghcr.io, tarball on the GitHub
# release. It does NOT mean deployed — that is `deploy-ivanti-mcp` in
# tyrunasj/k3s-home-lab, which is a separate button on purpose.

on:
  workflow_dispatch:

# One at a time. Two concurrent runs would race to publish the same version,
# and the loser would move `latest` backwards.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: tyrunas/ivanti-mcp

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # package.json is the source of truth; this asserts Chart.yaml `version`
      # and `appVersion` already agree with it. `appVersion` is the default
      # image tag, so drift there silently deploys the wrong image.
      - run: node scripts/check-version.mjs --check

      - id: version
        name: Resolve the version, and refuse a version already released
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::${tag} already exists. Bump package.json and run \`pnpm version:sync\`."
            exit 1
          fi

          # A prerelease (0.3.0-rc.1) publishes its exact version and nothing
          # else — no `latest`, no moving major/minor tags.
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (prerelease: ${prerelease}) from ${GITHUB_SHA}"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write   # create the tag and the GitHub release
      id-token: write   # keyless signing, no key to store or rotate
      packages: write   # push the Helm chart to ghcr.io
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # THE CHART GOES TO ghcr.io, NOT DOCKER HUB, AND THIS IS NOT A PREFERENCE.
      #
      # `helm push chart.tgz oci://<registry>/<namespace>` appends the CHART NAME to
      # the namespace, so pushing `ivanti-mcp` to `oci://registry-1.docker.io/tyrunas`
      # targets `tyrunas/ivanti-mcp:<version>` — the exact coordinate the image was
      # pushed to twelve steps earlier. Both are manifests, the registry accepts the
      # second, and the chart silently replaces the image: `docker pull` then returns
      # a Helm chart. Docker Hub has only `user/repo`, so there is no free namespace
      # to move it to.
      #
      # ghcr.io nests, so the chart gets `<owner>/charts/ivanti-mcp` and the chart
      # itself needs no renaming. `helm push` also keeps its own credential store —
      # logging Docker in does not log Helm in.
      - name: Log Helm in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # `value:` pins every tag to package.json's version. Without it the semver
      # patterns read `github.ref_name`, which on a manual run is the BRANCH —
      # so the image would publish as `main`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Ivanti MCP
            org.opencontainers.image.description=MCP server for Ivanti Neurons for ITSM
            org.opencontainers.image.licenses=UNLICENSED
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # Sign the digest, not a tag: a tag can be moved, a digest cannot.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # The same commit, as a tree that runs on a plain Node host.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No `head -1`: the script prints the path on stdout and nothing else. It used
      # to print pnpm's progress there too, so `head -1` captured a log line as the
      # filename — the upload then matched nothing AND still exited 0, which is why
      # the file is asserted here rather than trusted.
      - id: tarball
        run: |
          set -euo pipefail
          path="$(./scripts/release-tarball.sh "${RUNNER_TEMP}/release")"
          if [ ! -f "${path}" ]; then
            echo "::error::release-tarball.sh did not produce a file at '${path}'"
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # An OCI artifact, so no gh-pages branch and no chart-repo index to maintain.
      # Chart version and appVersion are already package.json's — `--version` here
      # would be a third place to get it wrong, so the chart is packaged as it sits.
      - name: Package and push the Helm chart
        run: |
          set -euo pipefail
          helm package charts/ivanti-mcp --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/ivanti-mcp-${VERSION}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

      # GitHub's own generator: the PR titles merged since the previous tag, the
      # contributors, and a full-changelog link. Fetched explicitly rather than via
      # `generate_release_notes: true`, because that APPENDS its block after the body
      # — which buries what changed under the install instructions. Here it leads.
      #
      # `target_commitish` is required: the tag does not exist yet.
      - id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}" --jq .body)"
          # A heredoc delimiter that cannot occur in generated markdown.
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            echo "${changed}"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      # This step creates the tag, at the commit that was actually built and
      # signed. Everything above has already published, so a green run here means
      # the tag and the artifacts describe the same tree.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.verify.outputs.tag }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'false' }}
          files: ${{ steps.tarball.outputs.path }}
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            ## Deploy

            **Container** — `docker pull ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}`
            Multi-arch (amd64, arm64), distroless, runs as uid 65532.
            Signed with cosign; verify with:
            ```
            cosign verify ${{ env.IMAGE }}:${{ needs.verify.outputs.version }} \
              --certificate-identity-regexp='^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            ```

            **Kubernetes** — `helm install ivanti-mcp oci://ghcr.io/${{ github.repository_owner }}/charts/ivanti-mcp --version ${{ needs.verify.outputs.version }}`
            One release is one tenant and one audience. See `charts/ivanti-mcp/README.md`.

            **Plain Node host** — download the tarball below, unpack it, and run
            `node dist/index.js`. It carries its own production dependencies and
            needs no toolchain. See `docs/deployment.md` for the systemd unit.

            Configuration is documented in `.env.example`. The server fails closed:
            an incomplete configuration exits 78 and prints every problem at once.
