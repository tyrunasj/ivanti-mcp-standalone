name: Release

# MANUAL, FROM main ONLY, AND THE VERSION COMES FROM package.json — NOT FROM A TAG
# YOU TYPE.
#
# Actions -> Release -> Run workflow on main, press the button. The workflow
# refuses any other ref, reads `package.json`, refuses if `Chart.yaml` disagrees
# or if that version has already been released, builds everything, and creates
# the tag and the GitHub Release itself at the end.
#
# So there is exactly one place a human writes a version — `package.json`,
# with `pnpm version:sync` mirroring it into the chart — and the tag is a
# consequence rather than a second copy to keep in step.
#
# ⚠️ Pushing a tag by hand now triggers NOTHING. That is the point: a tag is
# an output of this workflow, not an input to it.
#
# ⚠️ Only main. The signature's identity is this file AT A REF, and the documented
# `cosign verify` accepts exactly `release.yml@refs/heads/main` — so an image
# built from any other branch would be signed by an identity nobody trusts, or,
# with a looser check, trusted without review. `main` is protected; a branch is not.
#
# ──────────── Two jobs, deliberately ────────────
#
#   GATE runs the whole check suite — `pnpm install` with every devDependency,
#   the tests, the build — with `contents: read` and nothing else. PUBLISH holds
#   the write token, the OIDC token that signs as this workflow, and the Docker
#   Hub credentials, and installs no npm package at all.
#
#   They used to be one job, to avoid re-running checkout and the build. But a
#   job with `id-token: write` exposes the token-request endpoint to EVERY step
#   in it, and checkout left the write token in .git/config — so any package in
#   the devDependency tree that ran code during install or test could have minted
#   a signing identity or pushed a tag. Splitting them costs a
#   second checkout and one artifact hop: GATE builds the tarball from the `dist/`
#   its checks left behind, and PUBLISH downloads it rather than rebuilding it.
#
#   What this does NOT buy: the compiler is a devDependency, so a compromised one
#   could still shape `dist/`. It keeps the credentials out of its reach.
#
#   The checks themselves are NOT written here. They live in
#   .github/actions/checks and are shared with ci.yml, because this workflow
#   used to carry a subset of that list — four of the nine — and published
#   without ever running `check:examples` or `check:licenses`, which validate
#   `.env.example` and `THIRD-PARTY-NOTICES.md`: two files that ship inside the
#   tarball this workflow uploads.
#
# Third-party actions are pinned by commit SHA with the version beside it — a tag
# is a pointer its owner can move, and these steps run with write tokens.
# Dependabot proposes the next SHA. No checkout keeps its credentials.
#
# The tag is created LAST, by the release step. A run that dies halfway leaves
# a published image and no tag, which retries cleanly by pressing the button
# again; tagging first would leave an orphan tag that has to be deleted before
# a retry is possible.
#
# RELEASE means: image on Docker Hub, chart on ghcr.io, tarball on the GitHub
# release. It does NOT mean deployed — that is `deploy-ivanti-mcp` in
# tyrunasj/k3s-home-lab, which is a separate button on purpose.

on:
  workflow_dispatch:

# One at a time. Two concurrent runs would race to publish the same version,
# and the loser would move `latest` backwards.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

env:
  IMAGE: tyrunas/ivanti-mcp

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # A hung install or a registry that never answers should cost minutes, not
    # the six hours GitHub allows by default. Thirty, since it also builds and
    # scans an image.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # FIRST: nothing below means anything on another ref. It fails rather than
      # skips — a grey "skipped" run reads as done.
      - name: Refuse any ref but main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main only; this run is on ${GITHUB_REF}. Merge first, then run Release on main."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Before the checks on purpose: the likeliest reason a release run fails is
      # that package.json was never bumped, and that answer costs two seconds
      # rather than thirty. It needs no dependencies — `node -p` and `git
      # ls-remote` run on what the runner already has (the repository is public,
      # so ls-remote needs no credential).
      #
      # ls-remote exits 2 for "no such tag" and something else when it could not
      # ask at all; only the first may proceed, or an unreachable origin would read
      # as "not released yet".
      - id: version
        name: Resolve the version, and refuse a version already released
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) echo "::error::${tag} already exists. Bump package.json and run \`pnpm version:sync\`."; exit 1 ;;
            2) ;;
            *) echo "::error::Could not list tags on origin (git ls-remote exited ${rc})."; exit 1 ;;
          esac

          # A prerelease (0.3.0-rc.1) publishes its exact version and nothing
          # else — no `latest`, no moving major/minor tags.
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag} (prerelease: ${prerelease}) from ${GITHUB_SHA}"

      # Every check this repository runs, shared with ci.yml so this gate cannot
      # drift into a weaker subset of that one. It also leaves the `dist/` the
      # release tarball ships, which is why nothing below rebuilds it.
      - uses: ./.github/actions/checks

      # The same commit, as a tree that runs on a plain Node host. It packages
      # the `dist/` built by the checks above and installs its own production
      # dependencies into the staging directory.
      #
      # No `head -1`: the script prints the path on stdout and nothing else. It used
      # to print pnpm's progress there too, so `head -1` captured a log line as the
      # filename — the upload then matched nothing AND still exited 0, which is why
      # the file is asserted here rather than trusted.
      - id: tarball
        name: Build the release tarball
        run: |
          set -euo pipefail
          path="$(./scripts/release-tarball.sh "${RUNNER_TEMP}/release")"
          if [ ! -f "${path}" ]; then
            echo "::error::release-tarball.sh did not produce a file at '${path}'"
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: ${{ steps.tarball.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      # THE IMAGE IS SCANNED HERE, NOT IN PUBLISH. The scanner is a third-party
      # container, and this job holds no credential; Publish holds the tokens that
      # push, sign and tag. The same commit and the same digest-pinned bases, so the
      # amd64 image scanned here has the packages the published one has — and a
      # fixable critical or high stops the release before anything is pushed.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ivanti-mcp:scan
          cache-from: type=gha
      - uses: ./.github/actions/scan-image
        with:
          image: ivanti-mcp:scan

  publish:
    name: Publish
    needs: gate
    # The gate already refused; this keeps the write tokens off any other ref even
    # if someone edits the gate.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A hung multi-arch build or a registry that never answers should cost
    # minutes, not the six hours GitHub allows by default.
    timeout-minutes: 30
    permissions:
      contents: write   # create the tag and the GitHub release
      id-token: write   # keyless signing, no key to store or rotate
      packages: write   # push the Helm chart to ghcr.io
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      # The same commit the gate checked: on workflow_dispatch both jobs check out
      # github.sha, not whatever main has moved to since.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: ${{ runner.temp }}/release

      - id: tarball
        name: Locate the tarball the gate built
        run: |
          set -euo pipefail
          path="${RUNNER_TEMP}/release/ivanti-mcp-${VERSION}.tar.gz"
          if [ ! -f "${path}" ]; then
            echo "::error::The gate's tarball is not at '${path}'"
            exit 1
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # THE CHART GOES TO ghcr.io, NOT DOCKER HUB, AND THIS IS NOT A PREFERENCE.
      #
      # `helm push chart.tgz oci://<registry>/<namespace>` appends the CHART NAME to
      # the namespace, so pushing `ivanti-mcp` to `oci://registry-1.docker.io/tyrunas`
      # targets `tyrunas/ivanti-mcp:<version>` — the exact coordinate the image was
      # pushed to a few steps earlier. Both are manifests, the registry accepts the
      # second, and the chart silently replaces the image: `docker pull` then returns
      # a Helm chart. Docker Hub has only `user/repo`, so there is no free namespace
      # to move it to.
      #
      # ghcr.io nests, so the chart gets `<owner>/charts/ivanti-mcp` and the chart
      # itself needs no renaming. `helm push` also keeps its own credential store —
      # logging Docker in does not log Helm in.
      - name: Log Helm in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      # `value:` pins every tag to package.json's version. Without it the semver
      # patterns read `github.ref_name`, which on a manual run is the BRANCH —
      # so the image would publish as `main`.
      #
      # The labels restate the Dockerfile's, because metadata-action writes its own
      # defaults over them (licence from the GitHub API, url from the repository).
      # They used to say `licenses=UNLICENSED`, contradicting the image's own
      # `LicenseRef-SYNERGY-Commercial`.
      - id: meta
        name: Compose the image tags and labels
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.gate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.gate.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.gate.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=SYNERGY Ivanti MCP
            org.opencontainers.image.description=MCP server for Ivanti Neurons for ITSM
            org.opencontainers.image.url=https://www.synergy.eu
            org.opencontainers.image.licenses=LicenseRef-SYNERGY-Commercial
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}

      - id: build
        name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # Sign the digest, not a tag: a tag can be moved, a digest cannot. The
      # certificate names this file at refs/heads/main — which is what the
      # documented `cosign verify --certificate-identity` checks.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # An OCI artifact, so no gh-pages branch and no chart-repo index to maintain.
      # Chart version and appVersion are already package.json's — `--version` here
      # would be a third place to get it wrong, so the chart is packaged as it sits.
      # The gate has already linted it and rendered every guard.
      - name: Package and push the Helm chart
        run: |
          set -euo pipefail
          helm package charts/ivanti-mcp --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/ivanti-mcp-${VERSION}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

      # GitHub's own generator: the PR titles merged since the previous tag, the
      # contributors, and a full-changelog link. Fetched explicitly rather than via
      # `generate_release_notes: true`, because that APPENDS its block after the body
      # — which buries what changed under the install instructions. Here it leads.
      #
      # `target_commitish` is required: the tag does not exist yet.
      - id: notes
        name: Generate the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}" --jq .body)"
          # A heredoc delimiter that cannot occur in generated markdown.
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            echo "${changed}"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      # This step creates the tag, at the commit that was actually built and
      # signed. Everything above has already published, so a green run here means
      # the tag and the artifacts describe the same tree.
      - name: Tag it and publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.gate.outputs.tag }}
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.gate.outputs.prerelease == 'false' }}
          files: ${{ steps.tarball.outputs.path }}
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            ## Deploy

            **Container** — `docker pull ${{ env.IMAGE }}:${{ needs.gate.outputs.version }}`
            Multi-arch (amd64, arm64), distroless, runs as uid 65532.
            Signed with cosign by this repository's release workflow on `main`; verify with:
            ```
            cosign verify ${{ env.IMAGE }}:${{ needs.gate.outputs.version }} \
              --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main' \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            ```

            **Kubernetes** — `helm install ivanti-mcp oci://ghcr.io/${{ github.repository_owner }}/charts/ivanti-mcp --version ${{ needs.gate.outputs.version }}`
            One release is one tenant and one audience. See `charts/ivanti-mcp/README.md`.

            **Plain Node host** — download the tarball below, unpack it, and run
            `node dist/index.js`. It carries its own production dependencies and
            needs no toolchain. See `docs/deployment.md` for the systemd unit.

            Configuration is documented in `.env.example`. The server fails closed:
            an incomplete configuration exits 78 and prints every problem at once.
