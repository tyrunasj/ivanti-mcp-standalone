name: Release

# A tag is the trigger, and the tag is the version. `scripts/check-version.mjs`
# refuses the release when it disagrees with package.json, because the server
# reports its version from the manifest rather than from the tag.
on:
  push:
    tags: ['v*']

env:
  IMAGE: tyrunas/ivanti-mcp

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs "${{ github.ref_name }}"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # keyless signing, no key to store or rotate
      packages: write   # push the Helm chart to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # THE CHART GOES TO ghcr.io, NOT DOCKER HUB, AND THIS IS NOT A PREFERENCE.
      #
      # `helm push chart.tgz oci://<registry>/<namespace>` appends the CHART NAME to
      # the namespace, so pushing `ivanti-mcp` to `oci://registry-1.docker.io/tyrunas`
      # targets `tyrunas/ivanti-mcp:<version>` — the exact coordinate the image was
      # pushed to twelve steps earlier. Both are manifests, the registry accepts the
      # second, and the chart silently replaces the image: `docker pull` then returns
      # a Helm chart. Docker Hub has only `user/repo`, so there is no free namespace
      # to move it to.
      #
      # ghcr.io nests, so the chart gets `<owner>/charts/ivanti-mcp` and the chart
      # itself needs no renaming. `helm push` also keeps its own credential store —
      # logging Docker in does not log Helm in.
      - name: Log Helm in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # `latest` moves only for a final release. A prerelease tag (v1.2.3-rc.1)
      # publishes its exact version and nothing else, so nobody pulls an rc by
      # accident.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Ivanti MCP
            org.opencontainers.image.description=MCP server for Ivanti Neurons for ITSM
            org.opencontainers.image.licenses=UNLICENSED

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # Sign the digest, not a tag: a tag can be moved, a digest cannot.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # The same commit, as a tree that runs on a plain Node host.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: tarball
        run: |
          path="$(./scripts/release-tarball.sh "${RUNNER_TEMP}/release" | head -1)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # An OCI artifact, so no gh-pages branch and no chart-repo index to maintain.
      # Chart version and appVersion both follow the tag: this chart serves exactly
      # one application, and appVersion is what `image.tag: ""` falls back to.
      - name: Package and push the Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/ivanti-mcp \
            --version "$version" --app-version "$version" \
            --destination "${RUNNER_TEMP}/chart"
          helm push "${RUNNER_TEMP}/chart/ivanti-mcp-${version}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

      # GitHub's own generator: the PR titles merged since the previous tag, the
      # contributors, and a full-changelog link. Fetched explicitly rather than via
      # `generate_release_notes: true`, because that APPENDS its block after the body
      # — which buries what changed under the install instructions. Here it leads.
      - id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body)"
          # A heredoc delimiter that cannot occur in generated markdown.
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            echo "${changed}"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.tarball.outputs.path }}
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            ## Deploy

            **Container** — `docker pull ${{ env.IMAGE }}:${{ github.ref_name }}`
            Multi-arch (amd64, arm64), distroless, runs as uid 65532.
            Signed with cosign; verify with:
            ```
            cosign verify ${{ env.IMAGE }}:${{ github.ref_name }} \
              --certificate-identity-regexp='^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            ```

            **Kubernetes** — `helm install ivanti-mcp oci://ghcr.io/${{ github.repository_owner }}/charts/ivanti-mcp --version ${{ github.ref_name }}`
            One release is one tenant and one audience. See `charts/ivanti-mcp/README.md`.

            **Plain Node host** — download the tarball below, unpack it, and run
            `node dist/index.js`. It carries its own production dependencies and
            needs no toolchain. See `docs/deployment.md` for the systemd unit.

            Configuration is documented in `.env.example`. The server fails closed:
            an incomplete configuration exits 78 and prints every problem at once.
