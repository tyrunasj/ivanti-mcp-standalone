# One release is ONE tenant and ONE audience. Staging, UAT and production are three
# releases; `full` and `enduser` are two more. Never replicas, never one release
# with a list of tenants.

image:
  repository: tyrunas/ivanti-mcp
  # Defaults to the chart's appVersion. Pin a digest for production.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ONE. Refused above 1. HTTP sessions are held in memory, one server per
# Mcp-Session-Id, and the pod that answers `initialize` MINTS that id — so the
# request that creates a session carries nothing a load balancer could hash to
# find that pod again. The `upstream-hash-by` affinity this chart used to offer
# hashed an empty header onto one pod and every later request onto another; it
# could not work, and setting sessionAffinity.enabled is now refused too.
# 0 is allowed, to park a release.
#
# The cost of one replica: a rollout — an upgrade, a key rotation, a node drain —
# ends every open session. Clients reconnect with a new one.
replicaCount: 1

# Pods read their secrets ONCE, at startup, and with secrets.existingSecret the
# chart cannot see the Secret change — so rotating a key does not roll the pod.
# Change this value (a date, the secret's version) in the same commit as the
# rotation and the Deployment rolls declaratively; or run
# `kubectl rollout restart deploy/<release>`. See docs/deployment.md, "Rotating a key".
rolloutToken: ""

server:
  # REQUIRED. The externally visible URL, matched verbatim against the OAuth token
  # audience and the RFC 9728 metadata document. No trailing slash.
  publicUrl: ""
  # REQUIRED. Origin validation is what stops DNS rebinding.
  trustedOrigins: []

  mode: full            # full | enduser
  authMode: bearer      # none | bearer | oauth
  port: 3000
  maxSessions: 100
  # MCP_MAX_SESSIONS_PER_SUBJECT — optional; see .env.example. Empty = unset.
  maxSessionsPerSubject: ""
  # MCP_MAX_CALLS_PER_MINUTE — tool calls per conversation per minute. Empty = the
  # server default (120).
  maxCallsPerMinute: ""
  sessionIdleTtlSeconds: 1800
  logLevel: info        # debug logs every Ivanti query, which names people; diagnose, then revert

  # Required when mode is enduser. Technical Business Object names; the gate is
  # resolved against the tenant at startup, so a misspelling exits 78.
  enduser:
    businessObjects: []
    quickActions: []
    # The self-service role an impersonated enduser session opens under.
    # Empty = the server default, SelfServiceMobile. Resolved per person when
    # act_as runs, not at startup: a name this tenant does not use is reported
    # in that call's roleNote rather than refusing the boot.
    role: ""

ivanti:
  baseUrl: ""           # tenant origin, no path. The /HEAT prefix is probed.
  maxTier: ""           # odata | session | admin. Empty = whatever the key can do.
  # Impersonation. Set this AND provide the key ivanti-central-config-api-key
  # in the secret, and act_as opens an Ivanti session AS the person — every
  # surface follows them. Empty = act_as only decides who "my" means.
  configUrl: ""         # the ConfigDB tenant, e.g. https://config-<tenant>/
  # full mode only: pin the role an impersonated session opens under. Refused
  # when the person does not hold it, never silently ignored.
  impersonationRole: ""
  # IVANTI_IMPERSONATION_REQUIRED — see .env.example. Only meaningful with
  # configUrl set; false leaves the server default.
  impersonationRequired: false
  # IVANTI_TIMEOUT_MS / IVANTI_WRITE_TIMEOUT_MS, in milliseconds. Empty = the
  # server defaults (10000 and 30000).
  timeoutMs: ""
  writeTimeoutMs: ""
  # IVANTI_MAX_CONCURRENT_REQUESTS — requests in flight to the tenant at once. Empty
  # = the server default (16).
  maxConcurrentRequests: ""

oauth:
  issuer: ""
  audience: ""
  jwksUri: ""
  scopesSupported: []
  requiredScopes: []
  identityClaim: ""

# The API key and bearer token are mounted as FILES, never as environment
# variables: `kubectl describe pod` and /proc/<pid>/environ both show the
# environment, a projected secret shows a path.
secrets:
  # Recommended. Keys: ivanti-api-key, bearer-token (only for authMode=bearer),
  # ivanti-central-config-api-key (only with ivanti.configUrl — NOT the tenant key:
  # it comes from the ConfigDB tenant's CentralConfigApiKey group).
  existingSecret: ""
  # Development only — puts the values in the release, and therefore in Helm history.
  create: false
  ivantiApiKey: ""
  bearerToken: ""
  centralConfigApiKey: ""
  mountPath: /run/secrets

# The tenant hostname must resolve INSIDE the pod, which is a different question
# from whether it resolves on your workstation.
hostAliases: []
# - ip: 203.0.113.10
#   hostnames: [your-tenant.example.com]

service:
  type: ClusterIP
  port: 3000
  annotations: {}

# LoadBalancer and NodePort are refused with authMode=none, as an ingress is:
# each publishes the tool surface beyond the cluster with nothing in front of it.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: mcp.example.com
  #   paths: [{ path: /, pathType: Prefix }]
  tls: []

# Admits traffic to the pod from `from` only. `auto` turns it on exactly when
# authMode is none, where it is the only thing between the cluster and the tool
# surface. Empty `from` = pods in the release's own namespace. With an ingress,
# add the controller's namespace. `kubectl port-forward` and the kubelet's probes
# are not subject to it. Inert unless the CNI enforces NetworkPolicy (k3s,
# Calico and Cilium do; flannel alone does not).
networkPolicy:
  enabled: auto         # auto | true | false
  from: []
  # - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
  # - podSelector: { matchLabels: { app: my-agent } }

# Measured (docs/handbook.html, "How much memory it needs"), the 0.3.1 image on
# Linux: ~104 MiB resident idle, plus ~64 KiB per held session — 167 MiB at 1,000.
# The request holds even that; the limit is headroom for working sessions.
# Idle memory dominates across the whole range.
resources:
  requests: { cpu: 100m, memory: 192Mi }
  limits: { memory: 512Mi }

# The startup probe is generous because boot does real network work: it walks the
# tenant's base paths against $metadata and opens the ASMX session.
probes:
  startup: { periodSeconds: 5, failureThreshold: 24, timeoutSeconds: 3 }
  liveness: { periodSeconds: 30, failureThreshold: 3, timeoutSeconds: 3 }
  readiness: { periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3 }

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
