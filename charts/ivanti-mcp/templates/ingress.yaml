{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ivanti-mcp.fullname" . }}
  labels: {{- include "ivanti-mcp.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
    {{- if .Values.sessionAffinity.enabled }}
    {{- toYaml .Values.sessionAffinity.ingressAnnotations | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "ivanti-mcp.fullname" $ }}
                port: { name: http }
          {{- end }}
    {{- end }}
{{- end }}
