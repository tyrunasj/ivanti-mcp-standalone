{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ivanti-mcp.serviceAccountName" . }}
  labels: {{- include "ivanti-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The server calls out to Ivanti and an IdP; it never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
