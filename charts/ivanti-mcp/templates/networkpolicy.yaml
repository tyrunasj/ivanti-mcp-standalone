{{- if eq (include "ivanti-mcp.networkPolicyEnabled" .) "true" }}
# Admits traffic to the server's port from networkPolicy.from only — by default,
# pods in this release's namespace. On by default with authMode=none, where it is
# the only thing between the rest of the cluster and the whole tool surface.
# Egress is left open: the server calls the tenant and, under oauth, the IdP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivanti-mcp.fullname" . }}
  labels: {{- include "ivanti-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ivanti-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- with .Values.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.server.port }} }
    {{- if .Values.metrics.enabled }}
    # Metrics: a rule of their own. A rule admits its peers to the ports it lists
    # and no others, so the ingress controller admitted above reaches the MCP port
    # but never /metrics, and a scraper admitted here never reaches the tools.
    - from:
        {{- with .Values.metrics.from }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.metrics.port }} }
    {{- end }}
{{- end }}
