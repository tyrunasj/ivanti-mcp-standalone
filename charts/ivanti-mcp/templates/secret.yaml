{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Development only. These values land in the release, and therefore in Helm
# history — `helm get values` will show them. In production set
# secrets.existingSecret and manage the Secret with whatever you already use.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ivanti-mcp.fullname" . }}
  labels: {{- include "ivanti-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  ivanti-api-key: {{ .Values.secrets.ivantiApiKey | quote }}
  {{- if eq .Values.server.authMode "bearer" }}
  bearer-token: {{ .Values.secrets.bearerToken | quote }}
  {{- end }}
  {{- if .Values.ivanti.configUrl }}
  ivanti-central-config-api-key: {{ .Values.secrets.centralConfigApiKey | quote }}
  {{- end }}
{{- end }}
